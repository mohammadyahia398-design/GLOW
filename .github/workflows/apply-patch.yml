name: Apply patch

on:
  push:
    branches: [main]
    paths: ["patch.zip"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          unzip -o patch.zip
          rm patch.zip

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply patch" || exit 0
          git push
